version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The Blaxel SDK gets its own weekly PR so it never falls behind.
      blaxel-sdk:
        patterns:
          - "github.com/blaxel-ai/*"
      # Everything else is batched into one weekly PR for minor and patch releases.
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/blaxel-ai/*"
        update-types:
          - "minor"
          - "patch"
